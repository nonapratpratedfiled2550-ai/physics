<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141c2f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ฟิสิกส์ทีละขั้น</title>
<style>
  :root {
    --paper: #ebe4d8;
    --sheet: #fffdf8;
    --ink: #171410;
    --muted: #6a6359;
    --line: #ddd2c0;
    --sidebar: #0f1628;
    --sidebar-2: #182338;
    --cream: #f4efe6;
    --brass: #c9a45c;
    --teal: #0d6b62;
    --teal-deep: #084841;
    --teal-soft: #e3f3ef;
    --good: #17693c;
    --good-bg: #e7f6ed;
    --bad: #9a312a;
    --bad-bg: #fceceb;
    --info-bg: #e5f2f0;
    --warn: #8a5a12;
    --warn-bg: #fff4df;
    --shadow: 0 18px 44px rgba(23, 20, 16, 0.08);
    --rise: 180ms cubic-bezier(.2,.7,.2,1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    color: var(--ink);
    font-family: "Leelawadee UI", Tahoma, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.55;
    background:
      radial-gradient(1100px 520px at 8% -10%, rgba(13,107,98,0.10), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, rgba(201,164,92,0.14), transparent 55%),
      linear-gradient(180deg, #f2ebe0 0%, var(--paper) 45%, #e7dfd1 100%);
    padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    overscroll-behavior-y: contain;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button, a, [data-act], .plate, .factor, .term { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button { cursor: pointer; }
  input, textarea, select { font-size: 16px; } /* กัน iOS ซูมตอนโฟกัส */
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  .skip {
    position: absolute; left: 0.6rem; top: -3rem;
    background: white; padding: 0.4rem 0.7rem; z-index: 9;
  }
  .skip:focus { top: 0.6rem; }
  #app { min-height: 100%; min-height: 100dvh; }
  .shell {
    min-height: 100%; min-height: 100dvh;
    display: grid; grid-template-columns: 320px minmax(0, 1fr);
  }
  .sidebar {
    background:
      radial-gradient(480px 220px at 20% -10%, rgba(201,164,92,0.18), transparent 60%),
      linear-gradient(180deg, #142038 0%, var(--sidebar) 55%, #0b1220 100%);
    color: var(--cream);
    display: flex; flex-direction: column;
    min-height: 0; overflow: auto;
    padding: 1.15rem 0.95rem 0.85rem;
    border-right: 1px solid rgba(201,164,92,0.18);
  }
  .brand { display: flex; gap: 0.75rem; align-items: center; padding: 0 0.35rem 0.95rem; }
  .mark {
    width: 46px; height: 46px; flex: none; color: var(--brass);
    border: 1px solid rgba(198, 161, 90, 0.5); border-radius: 14px;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.03);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .mark svg { width: 26px; height: 26px; }
  .brand p { margin: 0; }
  .brand .name { font-size: 1.16rem; font-weight: 700; letter-spacing: 0.01em; }
  .brand .sub { color: #c9bfb2; font-size: 0.82rem; margin-top: 0.12rem; }
  .side-meter { margin: 0 0.2rem 0.85rem; padding: 0.65rem 0.7rem; border-radius: 14px; background: rgba(255,255,255,0.05); }
  .side-meter .row { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.82rem; color: #d5cbbd; }
  .meter {
    margin-top: 0.4rem; height: 7px; border-radius: 99px;
    background: rgba(255,255,255,0.08); overflow: hidden;
  }
  .meter span {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--brass), #efe0b4);
    transition: width var(--rise);
  }
  .side-note { margin: 0 0.35rem 0.7rem; color: #c9bfb2; font-size: 0.92rem; }
  .side-story { margin: 0 0.15rem 0.8rem; color: var(--cream); white-space: pre-wrap; }
  .side-prompt {
    width: 100%; min-height: 13.5rem; resize: vertical;
    border: 1px solid rgba(198, 161, 90, 0.45); border-radius: 14px;
    padding: 0.75rem 0.8rem; background: #fffdf9; color: var(--ink); line-height: 1.55;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .side-go { width: 100%; margin-top: 0.65rem; }
  .kbd-hint { margin: 0.45rem 0.2rem 0; color: #a89f91; font-size: 0.78rem; }
  .topic-live { margin: 0.75rem 0.15rem 0; border-radius: 14px; padding: 0.75rem 0.85rem; transition: background var(--rise), border-color var(--rise); }
  .topic-live p { margin: 0; }
  .topic-live.wait { background: rgba(255,255,255,0.05); color: #c9bfb2; }
  .topic-live.hit {
    background: linear-gradient(135deg, rgba(201,164,92,0.18), rgba(13,107,98,0.18));
    border: 1px solid rgba(198,161,90,0.55);
    animation: rise-in 280ms ease;
  }
  .topic-live .eyebrow { color: var(--brass); font-size: 0.78rem; }
  .topic-live .chap { margin-top: 0.18rem; font-weight: 700; font-size: 1.02rem; }
  .topic-live .meta { margin-top: 0.12rem; color: #d9d0c4; font-size: 0.86rem; }
  .topic-live .conf { margin-top: 0.45rem; }
  .conf-bar {
    height: 6px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden;
  }
  .conf-bar i { display: block; height: 100%; background: linear-gradient(90deg, #8fd0c6, var(--brass)); }
  .chapter-banner {
    border: 2px solid var(--teal); border-radius: 18px; padding: 1rem 1.05rem;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.65), transparent 55%),
      var(--teal-soft);
    animation: rise-in 320ms ease;
  }
  .chapter-banner h2 { margin: 0.18rem 0 0.28rem; font-size: 1.4rem; }
  .chapter-banner .eyebrow { margin: 0; color: var(--teal-deep); font-size: 0.82rem; font-weight: 700; }
  .alt-topics { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.65rem 0 0.2rem; }
  .alt-topics button {
    border: 1px solid var(--line); background: white; border-radius: 999px;
    padding: 0.28rem 0.7rem; font-size: 0.86rem; color: var(--muted);
  }
  .alt-topics button.on { background: var(--teal); color: white; border-color: var(--teal); }
  .guide { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
  .guide li {
    background: linear-gradient(180deg, #fff, #f7f2ea);
    border: 1px solid var(--line);
    border-radius: 16px; padding: 0.85rem 0.9rem;
    animation: rise-in 360ms ease both;
  }
  .guide li:nth-child(2) { animation-delay: 40ms; }
  .guide li:nth-child(3) { animation-delay: 80ms; }
  .guide li:nth-child(4) { animation-delay: 120ms; }
  .guide strong { display: block; margin-bottom: 0.15rem; }
  .guide .n {
    display: inline-grid; place-items: center;
    width: 1.45rem; height: 1.45rem; border-radius: 50%;
    background: var(--teal); color: white; font-size: 0.78rem; margin-right: 0.35rem;
  }
  .welcome-hero {
    display: grid; grid-template-columns: 1.35fr 0.85fr; gap: 1rem; align-items: stretch;
    margin-bottom: 0.85rem;
  }
  .welcome-hero .panel {
    background:
      radial-gradient(420px 180px at 90% 0%, rgba(13,107,98,0.12), transparent 60%),
      var(--sheet);
    border: 1px solid var(--line); border-radius: 22px; padding: 1.2rem 1.25rem;
    box-shadow: var(--shadow);
  }
  .welcome-hero h2 { margin: 0.2rem 0 0.45rem; font-size: 1.55rem; line-height: 1.25; }
  .welcome-hero .lead { margin: 0; color: var(--muted); }
  .mini-board {
    background: linear-gradient(180deg, #1d3054, #15233d);
    color: #f7f1e7; border-radius: 18px; padding: 1rem;
    display: grid; place-items: center;
    font-family: Cambria, Georgia, serif; font-size: 1.55rem;
    box-shadow: inset 0 0 0 1px rgba(198,161,90,0.35);
  }
  .mini-board span { color: #9fd9cf; }
  .check-list { margin: 0.7rem 0 0; padding: 0; list-style: none; display: grid; gap: 0.35rem; }
  .check-list li {
    display: flex; align-items: center; gap: 0.45rem;
    background: #f7f3ec; border-radius: 12px; padding: 0.45rem 0.65rem; font-size: 0.92rem;
  }
  .check-list li.ok { background: var(--good-bg); color: var(--good); }
  .check-list li.wait { color: var(--muted); }
  .dot {
    width: 0.7rem; height: 0.7rem; border-radius: 50%; flex: none;
    background: #cfc4b3;
  }
  .check-list li.ok .dot { background: var(--good); }
  .next-task {
    margin: 0.15rem 0 0.85rem;
    background: linear-gradient(135deg, #fff8e8, var(--teal-soft));
    border: 1px solid #e4d4b0;
    border-radius: 16px;
    padding: 0.85rem 1rem;
  }
  .next-task strong { display: block; font-size: 1.05rem; margin-bottom: 0.15rem; }
  .next-task p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .section-label {
    display: flex; align-items: center; gap: 0.45rem;
    margin: 0.95rem 0 0.55rem; font-weight: 700; font-size: 0.95rem;
  }
  .section-label .stepn {
    width: 1.55rem; height: 1.55rem; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--teal); color: white; font-size: 0.82rem;
  }
  .ask-box {
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 0.75rem; align-items: center;
    background: var(--teal-soft);
    border: 1px solid #bfd8d2;
    border-radius: 16px;
    padding: 0.85rem 0.95rem;
  }
  .ask-box .sym {
    font-family: Cambria, Georgia, serif;
    font-size: 2rem; line-height: 1; color: var(--teal-deep);
  }
  .ask-box select {
    border: 1px solid #b7cec8; border-radius: 11px; padding: 0.5rem 0.6rem; background: white; width: 100%;
  }
  .ask-box .unit { color: var(--teal-deep); font-weight: 700; }
  .var-cards { display: grid; gap: 0.55rem; }
  .var-card {
    display: grid;
    grid-template-columns: 4.2rem minmax(0, 1fr) auto;
    gap: 0.55rem 0.75rem;
    align-items: center;
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 0.75rem 0.85rem;
  }
  .var-card.filled { border-color: #b7d8c6; background: #f7fcf8; }
  .var-card .sym {
    font-family: Cambria, Georgia, serif;
    font-size: 1.75rem; color: var(--teal-deep); line-height: 1;
  }
  .var-card .meta { min-width: 0; }
  .var-card .meta strong { display: block; }
  .var-card .meta span { color: var(--muted); font-size: 0.86rem; }
  .var-card .var-actions {
    display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; justify-content: flex-end;
    grid-column: 1 / -1;
  }
  .var-card input[data-field="value"] {
    border: 1px solid var(--line); border-radius: 11px; padding: 0.55rem 0.65rem;
    background: #fffdf9; width: min(11rem, 100%); font-size: 1.05rem;
  }
  .var-card.filled input[data-field="value"] { border-color: #9fcbb0; }
  .btn.tiny { padding: 0.35rem 0.55rem; font-size: 0.84rem; border-radius: 10px; }
  .btn.use-found { background: var(--brass); color: #1c1408; font-weight: 700; }
  .add-box {
    margin-top: 0.35rem;
    background: #f7f3ec;
    border-radius: 16px;
    padding: 0.75rem 0.85rem;
  }
  .add-box .row {
    display: grid;
    grid-template-columns: minmax(8rem, 1.2fr) minmax(6rem, 0.8fr) auto;
    gap: 0.45rem; align-items: center;
  }
  .add-box select, .add-box input {
    border: 1px solid var(--line); border-radius: 11px; padding: 0.45rem 0.55rem; background: white; width: 100%;
  }
  .plan-box {
    margin: 0.35rem 0 0.85rem;
    background: #eef6f4;
    border: 1px solid #bfd8d2;
    border-radius: 16px;
    padding: 0.8rem 0.95rem;
  }
  .plan-box ol { margin: 0.35rem 0 0; padding-left: 1.2rem; }
  .plan-box li { margin: 0.2rem 0; }
  .plan-box li.now { font-weight: 700; color: var(--teal-deep); }
  .plan-box li.did { color: var(--good); }
  .step-tag {
    display: inline-block; margin-left: 0.3rem; background: #dff0ec; color: var(--teal-deep);
    border-radius: 999px; font-size: 0.74rem; padding: 0.05rem 0.45rem; font-weight: 700;
  }
  .side-foot {
    margin-top: auto; padding: 0.85rem 0.35rem 0.15rem;
    display: flex; justify-content: space-between; gap: 0.5rem; align-items: center;
    color: #b7ad9f; font-size: 0.8rem;
  }
  .linkish {
    background: transparent; border: 0; color: #e7d7b0; padding: 0.2rem; text-decoration: underline;
    text-underline-offset: 2px;
  }
  .workspace { min-width: 0; min-height: 0; overflow: auto; padding: 1.25rem 1.4rem 2.5rem; }
  .topbar { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-end; margin-bottom: 0.85rem; }
  .kicker { margin: 0; color: var(--teal); font-size: 0.82rem; letter-spacing: 0.04em; font-weight: 700; }
  h1.page { margin: 0.1rem 0 0; font-size: 1.6rem; line-height: 1.25; }
  .stepper { display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: flex-end; }
  .stepper button, .stepper span {
    display: flex; align-items: center; gap: 0.35rem;
    color: var(--muted); font-size: 0.86rem; padding: 0.2rem 0.35rem;
    background: transparent; border: 0; border-radius: 999px;
  }
  .stepper button:hover { background: rgba(13,107,98,0.08); }
  .stepper i {
    font-style: normal; width: 1.5rem; height: 1.5rem; border-radius: 50%;
    display: grid; place-items: center; border: 1px solid var(--line); background: white; font-size: 0.78rem;
  }
  .stepper .now { color: var(--ink); font-weight: 700; background: rgba(13,107,98,0.08); }
  .stepper .now i { background: var(--teal); color: white; border-color: var(--teal); }
  .stepper .did i { background: var(--good); color: white; border-color: var(--good); }
  .help { margin: 0 0 0.8rem; color: var(--muted); }
  .sheet, .card {
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 1.15rem 1.25rem 1.25rem;
    margin-bottom: 0.9rem;
    animation: rise-in 280ms ease;
  }
  .story { margin: 0.35rem 0 0.9rem; font-size: 1.06rem; }
  .msg {
    border-radius: 14px; padding: 0.8rem 0.95rem; margin-bottom: 0.85rem;
    animation: rise-in 220ms ease;
  }
  .msg.good { background: var(--good-bg); color: var(--good); }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .msg.info { background: var(--info-bg); color: var(--teal-deep); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 0.75rem; }
  .plate {
    text-align: left; width: 100%;
    border: 1px solid var(--line); background: white; border-radius: 18px;
    padding: 0.95rem 1rem 0.9rem; min-height: 118px;
    border-top: 4px solid var(--stripe, var(--teal));
    transition: border-color var(--rise), transform var(--rise), box-shadow var(--rise);
  }
  .plate:hover { transform: translateY(-3px); border-color: #d7c4a4; box-shadow: 0 10px 24px rgba(23,20,16,0.06); }
  .plate .label { display: block; font-weight: 700; }
  .plate small { display: block; color: var(--muted); margin-top: 0.25rem; }
  .plate.locked { opacity: 0.72; }
  .formula-face {
    font-family: Cambria, "Leelawadee UI", Georgia, serif;
    font-size: 1.55rem; color: var(--teal-deep); margin: 0.28rem 0 0.15rem; line-height: 1.2;
  }
  .vchips { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.45rem; }
  .vchips i {
    font-style: normal; font-family: Cambria, Georgia, serif;
    background: #f4efe6; border-radius: 999px; padding: 0.05rem 0.45rem; font-size: 0.95rem;
  }
  .headrow { display: flex; justify-content: space-between; gap: 0.8rem; align-items: baseline; margin-bottom: 0.7rem; }
  .headrow h2 { margin: 0; font-size: 1.18rem; }
  .note { color: var(--muted); font-size: 0.92rem; margin: 0.2rem 0 0.55rem; }
  .analysis { background: var(--teal-soft); border-radius: 16px; padding: 0.9rem 1rem; margin-top: 0.85rem; }
  .analysis h3 { margin: 0 0 0.35rem; font-size: 1.02rem; color: var(--teal-deep); }
  .analysis p { margin: 0.25rem 0; }
  .analysis .pill {
    display: inline-block; margin: 0.15rem 0.25rem 0.15rem 0;
    background: white; border-radius: 999px; padding: 0.15rem 0.55rem; font-size: 0.86rem;
  }
  .var-row {
    display: grid; grid-template-columns: minmax(8rem, 1.35fr) 8.5rem minmax(4rem, 0.9fr) auto;
    gap: 0.45rem; align-items: center; margin-bottom: 0.45rem;
  }
  .var-row input, .var-row select, .ask-pick {
    border: 1px solid var(--line); border-radius: 11px; padding: 0.45rem 0.55rem; background: white; width: 100%;
  }
  .var-row input:focus, .var-row select:focus, .ask-pick:focus, .side-prompt:focus,
  .var-card input:focus, .ask-box select:focus, .add-box select:focus, .add-box input:focus {
    border-color: var(--teal); box-shadow: 0 0 0 3px rgba(13,107,98,0.12);
    outline: none;
  }
  .found-hint { color: var(--brass); font-size: 0.8rem; }
  .plate.rec { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(15, 110, 100, 0.16); }
  .rec-tag {
    display: inline-block; margin-left: 0.35rem; background: var(--teal); color: white;
    border-radius: 999px; font-size: 0.75rem; padding: 0.05rem 0.45rem; font-weight: 700;
  }
  .ready-tag {
    display: inline-block; margin-left: 0.3rem; background: var(--good-bg); color: var(--good);
    border-radius: 999px; font-size: 0.74rem; padding: 0.05rem 0.45rem; font-weight: 700;
  }
  .need-tag {
    display: inline-block; margin-left: 0.3rem; background: var(--warn-bg); color: var(--warn);
    border-radius: 999px; font-size: 0.74rem; padding: 0.05rem 0.45rem; font-weight: 700;
  }
  .target {
    display: inline-flex; align-items: center; gap: 0.35rem;
    margin: 0 0 0.7rem; border-radius: 999px; padding: 0.3rem 0.8rem;
    background: var(--teal-soft); color: var(--teal-deep); font-size: 0.95rem;
  }
  .target.ready { background: var(--good-bg); color: var(--good); }
  .board {
    position: relative;
    background:
      radial-gradient(900px 180px at 50% -20%, rgba(255,255,255,0.08), transparent 55%),
      linear-gradient(180deg, #1d3054, #15233d);
    color: #f7f1e7;
    border-radius: 20px;
    padding: 1.4rem 1rem 1rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: inset 0 0 0 1px rgba(198, 161, 90, 0.35), inset 0 18px 40px rgba(0,0,0,0.18);
    touch-action: pan-x pan-y;
  }
  .mobile-tip {
    display: none;
    margin: 0.55rem 0 0;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 0.55rem 0.7rem;
    color: #d7e4f2;
    font-size: 0.88rem;
    text-align: center;
  }
  .factor, .term { min-height: 2.2rem; min-width: 2rem; }
  .board:before, .board:after {
    content: ""; position: absolute; width: 12px; height: 12px;
    border: 2px solid rgba(198, 161, 90, 0.75);
  }
  .board:before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
  .board:after { right: 10px; bottom: 10px; border-left: 0; border-top: 0; }
  .eqline {
    display: flex; justify-content: center; align-items: center; gap: 0.85rem;
    min-width: min-content;
    font-family: Cambria, "Leelawadee UI", Georgia, serif;
    font-size: 2.05rem; line-height: 1.15; padding: 0.35rem 0.4rem 0.15rem;
  }
  .equals { color: #9fd9cf; }
  .side { display: flex; align-items: center; border-radius: 12px; padding: 0.15rem; min-height: 2.4rem; }
  .side.over { outline: 2px dashed #e7c98a; outline-offset: 4px; background: rgba(231,201,138,0.08); }
  .num, .den { display: flex; align-items: center; justify-content: center; gap: 0.12rem; padding: 0.08rem 0.2rem; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; }

function formatNum(n) {
  if (!isFinite(n)) return '—';
  var r = Math.round(n * 1e6) / 1e6;
  if (Math.abs(r) < 1e-9) return '0';
  if (Math.abs(r - Math.round(r)) < 1e-6) return String(Math.round(r));
  return r.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
}
function formatConst(v) {
  if (Math.abs(v - 0.5) < 1e-9) return '½';
  if (Math.abs(v - 0.25) < 1e-9) return '¼';
  var fourPi2 = 4 * Math.PI * Math.PI;
  var twoPi = 2 * Math.PI;
  if (Math.abs(v - fourPi2) / fourPi2 < 1e-10) return '4π²';
  if (Math.abs(v - twoPi) / twoPi < 1e-10) return '2π';
  return formatNum(v);
}

  var check = canSolve(formula, pSolve);
  if (!check.ok) {
    var text = check.message;
    if (state.recommendId && state.recommendId !== id) {
      var right = formulaById(state.recommendId);
      if (right) text += ' ตอนนี้แนะนำ ' + right.classic;
    }
    setMessage('bad', text);
    render();
    return;
  }
  if (state.plan && state.plan.length) {
    var idx = -1;
    for (var i = 0; i < state.plan.length; i++) if (state.plan[i].formulaId === id) idx = i;
    if (idx >= 0) state.planIndex = idx;
  }
  startArrange(formula);
  render();
}
function doPrimary() {
  var sel = state.selected;
  if (!sel) { setMessage('info', 'คลิกพจน์หรือตัวแปรบนสมการก่อน'); render(); return; }
  if (sel.kind === 'denom') { applyOp(function (eq) { return moveDenom(eq, sel.side, sel.factor); }); return; }
  if (sel.kind === 'factor') { applyOp(function (eq) { return moveFactor(eq, sel.side, sel.factor); }); return; }
  applyOp(function (eq) { return moveTerm(eq, sel.side, sel.term); });
}
function reasonableness(key, value) {
  var notes = [];
  if (!isFinite(value)) return ['ค่าที่ได้ไม่ใช่จำนวนจริง'];
  if (key === 'a' && Math.abs(value) > 50) notes.push('ความเร่งมีขนาดใหญ่ผิดปกติเมื่อเทียบกับโจทย์ระดับมัธยมทั่วไป ตรวจหน่วยและค่าที่ใส่');
  if ((key === 'v' || key === 'u' || key === 'vs') && Math.abs(value) > 3e8) notes.push('อัตราเร็วเกินอัตราเร็วแสง ตรวจค่าและการจัดรูปอีกครั้ง');
  if (key === 'm' && value <= 0) notes.push('มวลควรเป็นค่าบวก');
  if (key === 't' && value < 0) notes.push('เวลาติดลบ ตรวจเครื่องหมายหลังย้ายข้าง');
  if (key === 'R' && value <= 0) notes.push('ความต้านทานควรเป็นค่าบวก');
  if (key === 'n' && (value < 1 || value > 3)) notes.push('ดัชนีหักเหของวัสดุทั่วไปมักอยู่ราว 1–2.5');
  if (!notes.length) notes.push('ขนาดของคำตอบดูสมเหตุสมผลกับหน่วยและความหมายของปริมาณนี้');
  return notes;
}
function doCalculate() {
  var p = current();
  var target = solveTarget();
  var goal = goalTarget();
  var iso = findIsolated(state.eq);
  if (!target || !iso || iso.name !== target) { setMessage('bad', 'ยังจัดรูปไม่ถึงตัวที่ต้องหาในขั้นนี้'); render(); return; }
  var known = knownOf(p);
  var value;
  try { value = evalSide(state.eq[other(iso.side)], known); }
  catch (err) { setMessage('bad', err.message || 'คำนวณไม่ได้'); render(); return; }
  if (!isFinite(value)) { setMessage('bad', 'ได้ค่าที่ไม่ใช่จำนวนจริง'); render(); return; }
  var arranged = eqText(state.eq);
  var plugged = eqText(state.eq, known, labelMap(p));
  if (p.answer != null && target === goal && !approxEqual(value, p.answer)) {
    setMessage('bad', 'คำนวณได้ ' + formatNum(value) + ' ยังไม่สอดคล้องกับแนวคำตอบของตัวอย่าง ลองย้อนกลับแล้วจัดรูปใหม่');
    render();
    return;
  }
  var topic = topicById(state.topicId);
  var formula = formulaById(state.formulaId);
  var info = SYM[target];
  var sense = reasonableness(target, value);
  var moves = Math.max(0, state.history.length - 1);
  var moreSteps = !!(state.plan && state.plan.length > 1 && state.planIndex < state.plan.length - 1 && target !== goal);
  var analysis = [
    moreSteps
      ? 'ขั้นนี้หา' + info.name + ' เป็นค่ากลางก่อน ยังไม่ใช่คำตอบสุดท้ายของโจทย์'
      : 'โจทย์ถาม' + info.name + ' จัดไว้ในบทที่ ' + topic.no + ' ' + topic.name,
    'สูตรที่ใช้คือ ' + formula.classic + ' หลังย้ายข้าง ' + moves + ' ครั้ง ได้ ' + arranged,
    plugged === arranged ? 'สมการนี้ใช้ค่าจากโจทย์ได้ทันที' : 'แทนค่าแล้วได้ ' + plugged,
    'หน่วยของคำตอบคือ ' + (info.unit ? info.unit + ' (' + info.unitTh + ')' : info.unitTh),
    sense[0],
    'จึงได้ ' + info.sym + ' = ' + formatNum(value) + (info.unit ? ' ' + info.unit : '')
  ];
  if (!moreSteps && p.answer != null) analysis.push('ตัวเลขนี้สอดคล้องกับแนวคำตอบของตัวอย่างในชุดฝึก');
  if (moreSteps) analysis.push('กด “ใช้ค่านี้ ไปสูตรถัดไป” เพื่อหา ' + SYM[goal].name + ' ต่อ');
  var rows = [{ label: 'สมการที่จัดแล้ว', text: arranged }];
  if (plugged !== arranged) rows.push({ label: 'แทนค่าจากโจทย์', text: plugged });
  rows.push({ label: 'ผลลัพธ์', text: info.sym + ' = ' + formatNum(value) + (info.unit ? ' ' + info.unit : '') });
  state.result = {
    valueText: formatNum(value),
    value: value,
    unknown: target,
    rows: rows,
    analysis: analysis,
    moreSteps: moreSteps,
    seal: moreSteps ? 'ค่ากลาง · ยังมีขั้นถัดไป' : (p.answer != null ? 'สอดคล้องกับตัวอย่าง' : 'คำตอบสุดท้าย'),
    scores: { moves: moves, confidence: state.confidence || 0, filled: filledCount(p) }
  };
  state.step = 4;
  if (!moreSteps) {
    if (state.exampleId) markSolved(state.exampleId);
    state.clears = (state.clears || 0) + 1;
  }
  setMessage(moreSteps ? 'info' : null, moreSteps ? 'ได้ค่ากลางแล้ว พร้อมไปสูตรถัดไป' : null);
  render();
}
function continueChain() {
  var r = state.result;
  if (!r || !r.moreSteps || r.value == null) { setMessage('bad', 'ยังไม่มีค่ากลางให้ใช้ต่อ'); render(); return; }
  var key = r.unknown;
  var exist = state.problem.given.filter(function (g) { return g.key === key; })[0];
  if (exist) { exist.value = r.value; exist.blank = false; delete exist.show; }
  else state.problem.given.push({ key: key, value: r.value, blank: false });
  state.chainLog = (state.chainLog || []).concat([{ find: key, valueText: r.valueText, classic: formulaById(state.formulaId).classic }]);
  state.planIndex += 1;
  state.problem.unknown = goalTarget();
  state.problem.answer = null;
  state.exampleId = null;
  state.formulaId = null;
  state.eq = null;
  state.undo = [];
  state.history = [];
  state.result = null;
  state.selected = null;
  state.step = 3;
  refreshAdvice();
  var next = currentStep();
  setMessage('good', next ? 'ต่อไปหา ' + SYM[next.find].sym + ' จาก ' + next.classic : 'ไปเลือกสูตรถัดไป');
  render();
}

function readPrompt() {
  var el = document.getElementById('prompt');
  if (el) state.prompt = el.value;
  return (state.prompt || '').trim();
}
function runAnalyze(example) {
  var text = example ? example.text : readPrompt();
  state.prompt = text;
  var res = analyzePrompt(text);
  if (!res.ok) { setMessage('bad', res.message); state.step = 1; render(); return; }
  applyAnalysis(res, example || null);
  render();
}
function addGiven() {
  var keyEl = document.getElementById('add-key');
  var valEl = document.getElementById('add-value');
  if (!keyEl || !valEl || !state.problem) return;
  var key = keyEl.value;
  var num = parseNumToken(String(valEl.value || '').trim());
  if (!isFinite(num.value)) { setMessage('bad', 'ใส่ค่าตัวเลขของตัวแปรที่เพิ่ม'); render(); return; }
  if (key === state.problem.unknown) { setMessage('bad', 'ตัวนี้เป็นสิ่งที่ต้องหาอยู่แล้ว'); render(); return; }
  var item = { key: key, value: num.value, blank: false };
  if (num.show) item.show = num.show;
  var exist = state.problem.given.filter(function (g) { return g.key === key; })[0];
  if (exist) { exist.value = item.value; exist.blank = false; if (item.show) exist.show = item.show; else delete exist.show; }
  else state.problem.given.push(item);
  state.problem.answer = null;
  state.exampleId = null;
  refreshAdvice();
  setMessage('info', 'เพิ่ม ' + SYM[key].sym + ' แล้ว');
  render();
}
function setGivenValue(key, raw) {
  var g = state.problem && state.problem.given.filter(function (item) { return item.key === key; })[0];
  if (!g) return;
  var num = parseNumToken(String(raw).trim());
  if (!String(raw).trim()) { g.value = null; g.blank = true; delete g.show; refreshAdvice(); return; }
  if (!isFinite(num.value)) return;
  g.value = num.value;
  g.blank = false;
  if (num.show) g.show = num.show; else delete g.show;
  state.problem.answer = null;
  state.exampleId = null;
  refreshAdvice();
}
function fillFound(key) {
  var g = state.problem && state.problem.given.filter(function (item) { return item.key === key; })[0];
  if (!g || g.found == null) return;
  g.value = g.found;
  g.blank = false;
  if (g.foundShow) g.show = g.foundShow; else delete g.show;
  state.problem.answer = null;
  state.exampleId = null;
  refreshAdvice();
}
function fillAllFound() {
  if (!state.problem) return;
  state.problem.given.forEach(function (g) {
    if (g.found == null || !(g.blank || g.value == null)) return;
    g.value = g.found;
    g.blank = false;
    if (g.foundShow) g.show = g.foundShow; else delete g.show;
  });
  state.problem.answer = null;
  state.exampleId = null;
  refreshAdvice();
}
function pickTopic(id) {
  if (!topicById(id) || !state.problem) return;
  state.topicId = id;
  state.problem.topic = id;
  state.problem.answer = null;
  state.exampleId = null;
  state.formulaId = null;
  state.eq = null;
  state.result = null;
  state.planIndex = 0;
  state.chainLog = [];
  refreshAdvice();
  var topic = topicById(id);
  setMessage('info', 'เปลี่ยนเป็นบทที่ ' + topic.no + ' ' + topic.name);
}
function handle(ds) {
  var act = ds.act;
  if (act === 'wipe') {
    if (!state.confirmWipe) {
      state.confirmWipe = true;
      render();
      return;
    }
    memory.session = null;
    state.solved = [];
    blankWork();
    try { localStorage.removeItem(SAVE_KEY); } catch (err) { /* ignore */ }
    render();
    return;
  }
  state.confirmWipe = false;
  try {
    if (act === 'analyze') return runAnalyze(null);
    if (act === 'example') return runAnalyze(problems[Number(ds.index)]);
    if (act === 'fresh') { blankWork(); render(); return; }
    if (act === 'edit-prompt') { state.step = 1; state.formulaId = null; state.eq = null; setMessage(null); render(); return; }
    if (act === 'pick-topic') { pickTopic(ds.id); render(); return; }
    if (act === 'fill-found') { fillFound(ds.key); setMessage('info', 'ใส่ค่าที่พบในโจทย์แล้ว'); render(); return; }
    if (act === 'fill-all-found') { fillAllFound(); setMessage('info', 'ใส่ค่าที่พบทั้งหมดแล้ว ตรวจอีกครั้งก่อนคำนวณ'); render(); return; }
    if (act === 'jump-step') {
      var to = Number(ds.step);
      if (!(to >= 1 && to < state.step)) return;
      state.step = to;
      if (to < 4) { state.eq = null; state.formulaId = null; state.result = null; state.selected = null; }
      if (to < 3) { state.formulaId = null; }
      setMessage(null);
      render(); return;
    }
    if (act === 'next-vars') {
      if (!state.topicId) { setMessage('bad', 'เลือกบทก่อน'); render(); return; }
      refreshAdvice();
      state.step = 3;
      state.formulaId = null;
      state.eq = null;
      state.result = null;
      setMessage(state.recommendId ? 'good' : 'info', state.reasons[3] || 'ใส่ค่าตัวแปร แล้วคลิกสูตร');
      render(); return;
    }
    if (act === 'add-given') return addGiven();
    if (act === 'drop-given') {
      state.problem.given = state.problem.given.filter(function (g) { return g.key !== ds.key; });
      state.problem.answer = null;
      state.exampleId = null;
      refreshAdvice();
      render(); return;
    }
    if (act === 'formula') return chooseFormula(ds.id);
    if (act === 'back-topic') {
      state.step = 2; state.formulaId = null; state.eq = null; state.result = null; state.selected = null; setMessage(null); render(); return;
    }
    if (act === 'back-formula') {
      state.step = 3; state.formulaId = null; state.eq = null; state.result = null; state.selected = null; state.hintOn = false; setMessage(null); render(); return;
    }
    if (act === 'pick-factor') {
      var term = state.eq[ds.side].terms[Number(ds.term)];
      if (term && term.factors.length === 1) state.selected = { kind: 'term', side: ds.side, term: Number(ds.term) };
      else state.selected = { kind: 'factor', side: ds.side, term: Number(ds.term), factor: Number(ds.factor) };
      render(); return;
    }
    if (act === 'pick-term') { state.selected = { kind: 'term', side: ds.side, term: Number(ds.term) }; render(); return; }
    if (act === 'pick-denom') { state.selected = { kind: 'denom', side: ds.side, term: 0, factor: Number(ds.factor) }; render(); return; }
    if (act === 'move') return doPrimary();
    if (act === 'move-term') {
      if (!state.selected) return;
      applyOp(function (eq) { return moveTerm(eq, state.selected.side, state.selected.term); });
      return;
    }
    if (act === 'sqrt') return applyOp(takeSqrt);
    if (act === 'square') return applyOp(squareBoth);
    if (act === 'sub') return applyOp(function (eq) { return substituteKnown(eq, knownOf(current())); });
    if (act === 'hint') { state.hintOn = !state.hintOn; render(); return; }
    if (act === 'undo') {
      if (!state.undo.length) return;
      state.eq = state.undo.pop();
      if (state.history.length > 1) state.history.pop();
      state.selected = null;
      setMessage('info', 'ย้อนกลับหนึ่งขั้น');
      render(); return;
    }
    if (act === 'reset-eq') { startArrange(formulaById(state.formulaId)); render(); return; }
    if (act === 'calc') return doCalculate();
    if (act === 'continue-chain') return continueChain();
    if (act === 'retry') {
      state.result = null;
      if (state.formulaId && formulaById(state.formulaId)) startArrange(formulaById(state.formulaId));
      else { state.step = 3; state.eq = null; }
      setMessage(null);
      render(); return;
    }
    if (act === 'print') { window.print(); return; }
  } catch (err) {
    setMessage('bad', 'ทำขั้นนี้ไม่สำเร็จ ลองย้อนกลับหรือเริ่มจัดรูปใหม่');
    render();
  }
}
function onDrop(sideName) {
  if (!dragPayload || state.step !== 4 || !state.eq) return;
  var payload = dragPayload;
  dragPayload = null;
  if (payload.side === sideName) { setMessage('info', 'ปล่อยที่อีกฝั่งของเครื่องหมายเท่ากับ'); render(); return; }
  if (payload.kind === 'denom') { applyOp(function (eq) { return moveDenom(eq, payload.side, payload.factor); }); return; }
  if (payload.kind === 'factor') {
    var term = state.eq[payload.side].terms[payload.term];
    if (!term || term.factors.length < 2) applyOp(function (eq) { return moveTerm(eq, payload.side, payload.term); });
    else applyOp(function (eq) { return moveFactor(eq, payload.side, payload.factor); });
    return;
  }
  applyOp(function (eq) { return moveTerm(eq, payload.side, payload.term); });
}
function boot() {
  loadStore();
  var app = document.getElementById('app');
  if (!app) return;
  var topicTimer = null;
  app.addEventListener('input', function (e) {
    var el = e.target;
    if (!el || !el.dataset) return;
    if (el.dataset.field === 'prompt') {
      state.prompt = el.value;
      clearTimeout(topicTimer);
      topicTimer = setTimeout(paintTopicLive, 180);
    }
  });
  app.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.dataset || !state.problem) return;
    if (el.dataset.field === 'value') { setGivenValue(el.dataset.key, el.value); render(); }
    if (el.dataset.field === 'unknown') {
      state.problem.given = state.problem.given.filter(function (g) { return g.key !== el.value; });
      state.problem.unknown = el.value || null;
      state.goalUnknown = el.value || null;
      state.planIndex = 0;
      state.chainLog = [];
      state.problem.answer = null;
      state.exampleId = null;
      refreshAdvice();
      render();
    }
    if (el.dataset.field === 'topic') {
      state.topicId = el.value || null;
      state.problem.answer = null;
      state.exampleId = null;
      refreshAdvice();
      setMessage('info', state.reasons[2] || '');
      render();
    }
  });
  app.addEventListener('focusin', function (e) {
    var el = e.target;
    if (!el || !isMobileUi()) return;
    if (el.matches && el.matches('input, textarea, select')) {
      setTimeout(function () {
        try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) { el.scrollIntoView(true); }
      }, 120);
    }
  });
  app.addEventListener('click', function (e) {
    if (suppressClick) { suppressClick = false; return; }
    var el = e.target.closest('[data-act]');
    if (!el) return;
    handle(el.dataset);
  });
  app.addEventListener('dblclick', function (e) {
    if (isMobileUi()) return;
    var el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.dataset.act === 'pick-factor' || el.dataset.act === 'pick-term' || el.dataset.act === 'pick-denom') doPrimary();
  });
  app.addEventListener('dragstart', function (e) {
    if (!canDragBoard()) { e.preventDefault(); return; }
    var el = e.target.closest('[data-drag]');
    if (!el) return;
    dragPayload = { kind: el.dataset.drag, side: el.dataset.side, term: Number(el.dataset.term), factor: Number(el.dataset.factor) };
    if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'move'); }
  });
  app.addEventListener('dragover', function (e) {
    if (!canDragBoard()) return;
    var zone = e.target.closest('[data-drop]');
    if (!zone) return;
    e.preventDefault();
    document.querySelectorAll('.side.over').forEach(function (node) { node.classList.remove('over'); });
    zone.classList.add('over');
  });
  app.addEventListener('drop', function (e) {
    if (!canDragBoard()) return;
    var zone = e.target.closest('[data-drop]');
    if (!zone) return;
    e.preventDefault();
    suppressClick = true;
    onDrop(zone.dataset.drop);
  });
  app.addEventListener('dragend', function () {
    dragPayload = null;
    document.querySelectorAll('.side.over').forEach(function (node) { node.classList.remove('over'); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && state.step === 1) {
      e.preventDefault();
      handle({ act: 'analyze' });
      return;
    }
    if (state.step !== 4) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); handle({ act: 'undo' }); }
    else if (e.key === 'Escape' && state.selected) { state.selected = null; render(); }
    else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
      var iso = state.eq && findIsolated(state.eq);
      var target = solveTarget();
      if (state.result && state.result.moreSteps) { e.preventDefault(); handle({ act: 'continue-chain' }); }
      else if (iso && target && iso.name === target) { e.preventDefault(); handle({ act: 'calc' }); }
      else if (state.selected) { e.preventDefault(); handle({ act: 'move' }); }
    }
  });
  window.addEventListener('resize', function () {
    clearTimeout(window.__physResize);
    window.__physResize = setTimeout(function () {
      if (state.step >= 1) render();
    }, 250);
  });
  render();
}

if (typeof document !== 'undefined') boot();
if (globalThis.RUN_PHYSICS_TEST) {
  globalThis.PhysicsLab = {
    problems: problems, formulas: formulas, topics: topics, SYM: SYM, state: state, memory: memory,
    freshEquation: freshEquation, moveTerm: moveTerm, moveFactor: moveFactor, moveDenom: moveDenom,
    takeSqrt: takeSqrt, findIsolated: findIsolated, evalSide: evalSide, eqText: eqText,
    canSolve: canSolve, knownOf: knownOf, other: other, nextHint: nextHint, approxEqual: approxEqual, analyzePrompt: analyzePrompt,
    findPlan: findPlan, handle: handle, blankWork: blankWork, solveTarget: solveTarget
  };
}
</script>
