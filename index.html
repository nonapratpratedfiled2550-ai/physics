<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a20">
<meta name="description" content="Physics Learning ระบบฝึกคิดโจทย์ฟิสิกส์ ม.4–ม.6 พิมพ์โจทย์เอง ระบบชี้บท สูตร และตัวแปร พร้อมคลังสูตร สื่อจำลอง และติดตามความก้าวหน้า">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23071233'/%3E%3Cg fill='none' stroke='%237dd3fc' stroke-width='2.4'%3E%3Cellipse cx='24' cy='24' rx='17' ry='6.5'/%3E%3Cellipse cx='24' cy='24' rx='17' ry='6.5' transform='rotate(60 24 24)'/%3E%3Cellipse cx='24' cy='24' rx='17' ry='6.5' transform='rotate(-60 24 24)'/%3E%3C/g%3E%3Ccircle cx='24' cy='24' r='4' fill='%23fff'/%3E%3C/svg%3E">

<title>Physics Learning</title>
<style>
  :root {
    --paper: #ebe4d8;
    --sheet: #fffdf8;
    --ink: #171410;
    --muted: #6a6359;
    --line: #ddd2c0;
    --sidebar: #0f1628;
    --sidebar-2: #182338;
    --cream: #f4efe6;
    --brass: #c9a45c;
    --teal: #0d6b62;
    --teal-deep: #084841;
    --teal-soft: #e3f3ef;
    --good: #17693c;
    --good-bg: #e7f6ed;
    --bad: #9a312a;
    --bad-bg: #fceceb;
    --info-bg: #e5f2f0;
    --warn: #8a5a12;
    --warn-bg: #fff4df;
    --shadow: 0 18px 44px rgba(23, 20, 16, 0.08);
    --rise: 180ms cubic-bezier(.2,.7,.2,1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    color: var(--ink);
    font-family: "Leelawadee UI", Tahoma, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.55;
    background:
      radial-gradient(1100px 520px at 8% -10%, rgba(13,107,98,0.10), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, rgba(201,164,92,0.14), transparent 55%),
      linear-gradient(180deg, #f2ebe0 0%, var(--paper) 45%, #e7dfd1 100%);
    padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    overscroll-behavior-y: contain;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button, a, [data-act], .plate, .factor, .term { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button { cursor: pointer; }
  input, textarea, select { font-size: 16px; } /* กัน iOS ซูมตอนโฟกัส */
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  .skip {
    position: absolute; left: 0.6rem; top: -3rem;
    background: white; padding: 0.4rem 0.7rem; z-index: 9;
  }
  .skip:focus { top: 0.6rem; }
  #app { min-height: 100%; min-height: 100dvh; }
  .shell {
    min-height: 100%; min-height: 100dvh;
    display: grid; grid-template-columns: 320px minmax(0, 1fr);
  }
  .sidebar {
    background:
      radial-gradient(480px 220px at 20% -10%, rgba(201,164,92,0.18), transparent 60%),
      linear-gradient(180deg, #142038 0%, var(--sidebar) 55%, #0b1220 100%);
    color: var(--cream);
    display: flex; flex-direction: column;
    min-height: 0; overflow: auto;
    padding: 1.15rem 0.95rem 0.85rem;
    border-right: 1px solid rgba(201,164,92,0.18);
  }
  .brand { display: flex; gap: 0.75rem; align-items: center; padding: 0 0.35rem 0.95rem; }
  .mark {
    width: 46px; height: 46px; flex: none; color: var(--brass);
    border: 1px solid rgba(198, 161, 90, 0.5); border-radius: 14px;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.03);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .mark svg { width: 26px; height: 26px; }
  .brand p { margin: 0; }
  .brand .name { font-size: 1.16rem; font-weight: 700; letter-spacing: 0.01em; }
  .brand .sub { color: #c9bfb2; font-size: 0.82rem; margin-top: 0.12rem; }
  .side-meter { margin: 0 0.2rem 0.85rem; padding: 0.65rem 0.7rem; border-radius: 14px; background: rgba(255,255,255,0.05); }
  .side-meter .row { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.82rem; color: #d5cbbd; }
  .meter {
    margin-top: 0.4rem; height: 7px; border-radius: 99px;
    background: rgba(255,255,255,0.08); overflow: hidden;
  }
  .meter span {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--brass), #efe0b4);
    transition: width var(--rise);
  }
  .side-note { margin: 0 0.35rem 0.7rem; color: #c9bfb2; font-size: 0.92rem; }
  .side-story { margin: 0 0.15rem 0.8rem; color: var(--cream); white-space: pre-wrap; }
  .side-prompt {
    width: 100%; min-height: 13.5rem; resize: vertical;
    border: 1px solid rgba(198, 161, 90, 0.45); border-radius: 14px;
    padding: 0.75rem 0.8rem; background: #fffdf9; color: var(--ink); line-height: 1.55;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .side-go { width: 100%; margin-top: 0.65rem; }
  .kbd-hint { margin: 0.45rem 0.2rem 0; color: #a89f91; font-size: 0.78rem; }
  .topic-live { margin: 0.75rem 0.15rem 0; border-radius: 14px; padding: 0.75rem 0.85rem; transition: background var(--rise), border-color var(--rise); }
  .topic-live p { margin: 0; }
  .topic-live.wait { background: rgba(255,255,255,0.05); color: #c9bfb2; }
  .topic-live.hit {
    background: linear-gradient(135deg, rgba(201,164,92,0.18), rgba(13,107,98,0.18));
    border: 1px solid rgba(198,161,90,0.55);
    animation: rise-in 280ms ease;
  }
  .topic-live .eyebrow { color: var(--brass); font-size: 0.78rem; }
  .topic-live .chap { margin-top: 0.18rem; font-weight: 700; font-size: 1.02rem; }
  .topic-live .meta { margin-top: 0.12rem; color: #d9d0c4; font-size: 0.86rem; }
  .topic-live .conf { margin-top: 0.45rem; }
  .conf-bar {
    height: 6px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden;
  }
  .conf-bar i { display: block; height: 100%; background: linear-gradient(90deg, #8fd0c6, var(--brass)); }
  .chapter-banner {
    border: 2px solid var(--teal); border-radius: 18px; padding: 1rem 1.05rem;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.65), transparent 55%),
      var(--teal-soft);
    animation: rise-in 320ms ease;
  }
  .chapter-banner h2 { margin: 0.18rem 0 0.28rem; font-size: 1.4rem; }
  .chapter-banner .eyebrow { margin: 0; color: var(--teal-deep); font-size: 0.82rem; font-weight: 700; }
  .alt-topics { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.65rem 0 0.2rem; }
  .alt-topics button {
    border: 1px solid var(--line); background: white; border-radius: 999px;
    padding: 0.28rem 0.7rem; font-size: 0.86rem; color: var(--muted);
  }
  .alt-topics button.on { background: var(--teal); color: white; border-color: var(--teal); }
  .guide { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
  .guide li {
    background: linear-gradient(180deg, #fff, #f7f2ea);
    border: 1px solid var(--line);
    border-radius: 16px; padding: 0.85rem 0.9rem;
    animation: rise-in 360ms ease both;
  }
  .guide li:nth-child(2) { animation-delay: 40ms; }
  .guide li:nth-child(3) { animation-delay: 80ms; }
  .guide li:nth-child(4) { animation-delay: 120ms; }
  .guide strong { display: block; margin-bottom: 0.15rem; }
  .guide .n {
    display: inline-grid; place-items: center;
    width: 1.45rem; height: 1.45rem; border-radius: 50%;
    background: var(--teal); color: white; font-size: 0.78rem; margin-right: 0.35rem;
  }
  .welcome-hero {
    display: grid; grid-template-columns: 1.35fr 0.85fr; gap: 1rem; align-items: stretch;
    margin-bottom: 0.85rem;
  }
  .welcome-hero .panel {
    background:
      radial-gradient(420px 180px at 90% 0%, rgba(13,107,98,0.12), transparent 60%),
      var(--sheet);
    border: 1px solid var(--line); border-radius: 22px; padding: 1.2rem 1.25rem;
    box-shadow: var(--shadow);
  }
  .welcome-hero h2 { margin: 0.2rem 0 0.45rem; font-size: 1.55rem; line-height: 1.25; }
  .welcome-hero .lead { margin: 0; color: var(--muted); }
  .mini-board {
    background: linear-gradient(180deg, #1d3054, #15233d);
    color: #f7f1e7; border-radius: 18px; padding: 1rem;
    display: grid; place-items: center;
    font-family: Cambria, Georgia, serif; font-size: 1.55rem;
    box-shadow: inset 0 0 0 1px rgba(198,161,90,0.35);
  }
  .mini-board span { color: #9fd9cf; }
  .check-list { margin: 0.7rem 0 0; padding: 0; list-style: none; display: grid; gap: 0.35rem; }
  .check-list li {
    display: flex; align-items: center; gap: 0.45rem;
    background: #f7f3ec; border-radius: 12px; padding: 0.45rem 0.65rem; font-size: 0.92rem;
  }
  .check-list li.ok { background: var(--good-bg); color: var(--good); }
  .check-list li.wait { color: var(--muted); }
  .dot {
    width: 0.7rem; height: 0.7rem; border-radius: 50%; flex: none;
    background: #cfc4b3;
  }
  .check-list li.ok .dot { background: var(--good); }
  .next-task {
    margin: 0.15rem 0 0.85rem;
    background: linear-gradient(135deg, #fff8e8, var(--teal-soft));
    border: 1px solid #e4d4b0;
    border-radius: 16px;
    padding: 0.85rem 1rem;
  }
  .next-task strong { display: block; font-size: 1.05rem; margin-bottom: 0.15rem; }
  .next-task p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .section-label {
    display: flex; align-items: center; gap: 0.45rem;
    margin: 0.95rem 0 0.55rem; font-weight: 700; font-size: 0.95rem;
  }
  .section-label .stepn {
    width: 1.55rem; height: 1.55rem; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--teal); color: white; font-size: 0.82rem;
  }
  .ask-box {
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 0.75rem; align-items: center;
    background: var(--teal-soft);
    border: 1px solid #bfd8d2;
    border-radius: 16px;
    padding: 0.85rem 0.95rem;
  }
  .ask-box .sym {
    font-family: Cambria, Georgia, serif;
    font-size: 2rem; line-height: 1; color: var(--teal-deep);
  }
  .ask-box select {
    border: 1px solid #b7cec8; border-radius: 11px; padding: 0.5rem 0.6rem; background: white; width: 100%;
  }
  .ask-box .unit { color: var(--teal-deep); font-weight: 700; }
  .var-cards { display: grid; gap: 0.55rem; }
  .var-card {
    display: grid;
    grid-template-columns: 4.2rem minmax(0, 1fr) auto;
    gap: 0.55rem 0.75rem;
    align-items: center;
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 0.75rem 0.85rem;
  }
  .var-card.filled { border-color: #b7d8c6; background: #f7fcf8; }
  .var-card .sym {
    font-family: Cambria, Georgia, serif;
    font-size: 1.75rem; color: var(--teal-deep); line-height: 1;
  }
  .var-card .meta { min-width: 0; }
  .var-card .meta strong { display: block; }
  .var-card .meta span { color: var(--muted); font-size: 0.86rem; }
  .var-card .var-actions {
    display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; justify-content: flex-end;
    grid-column: 1 / -1;
  }
  .var-card input[data-field="value"] {
    border: 1px solid var(--line); border-radius: 11px; padding: 0.55rem 0.65rem;
    background: #fffdf9; width: min(11rem, 100%); font-size: 1.05rem;
  }
  .var-card.filled input[data-field="value"] { border-color: #9fcbb0; }
  .var-note { display: block; font-size: 0.8rem; color: #8a5a12; margin-top: 0.15rem; }
  .var-note.ok { color: var(--teal-deep); }
  .btn.tiny { padding: 0.35rem 0.55rem; font-size: 0.84rem; border-radius: 10px; }
  .btn.use-found { background: var(--brass); color: #1c1408; font-weight: 700; }
  .add-box {
    margin-top: 0.35rem;
    background: #f7f3ec;
    border-radius: 16px;
    padding: 0.75rem 0.85rem;
  }
  .add-box .row {
    display: grid;
    grid-template-columns: minmax(8rem, 1.2fr) minmax(6rem, 0.8fr) auto;
    gap: 0.45rem; align-items: center;
  }
  .add-box select, .add-box input {
    border: 1px solid var(--line); border-radius: 11px; padding: 0.45rem 0.55rem; background: white; width: 100%;
  }
  .plan-box {
    margin: 0.35rem 0 0.85rem;
    background: #eef6f4;
    border: 1px solid #bfd8d2;
    border-radius: 16px;
    padding: 0.8rem 0.95rem;
  }
  .plan-box ol { margin: 0.35rem 0 0; padding-left: 1.2rem; }
  .plan-box li { margin: 0.2rem 0; }
  .plan-box li.now { font-weight: 700; color: var(--teal-deep); }
  .plan-box li.did { color: var(--good); }
  .step-tag {
    display: inline-block; margin-left: 0.3rem; background: #dff0ec; color: var(--teal-deep);
    border-radius: 999px; font-size: 0.74rem; padding: 0.05rem 0.45rem; font-weight: 700;
  }
  .nav-tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem;
    margin: 0 0.2rem 0.85rem; padding: 0.3rem;
    background: rgba(255,255,255,0.06); border-radius: 14px;
  }
  .nav-tabs button {
    border: 0; border-radius: 11px; padding: 0.55rem 0.4rem; min-height: 2.6rem;
    background: transparent; color: #d5cbbd; font-size: 0.92rem;
  }
  .nav-tabs button.on { background: var(--brass); color: #1c1408; font-weight: 700; }
  .side-sims { display: grid; gap: 0.4rem; }
  .side-sims button {
    display: grid; grid-template-columns: auto 1fr; gap: 0.6rem; align-items: center;
    text-align: left; width: 100%; border: 1px solid transparent; border-radius: 14px;
    background: rgba(255,255,255,0.04); color: var(--cream); padding: 0.6rem 0.65rem;
  }
  .side-sims button.on { background: rgba(255,255,255,0.1); border-color: rgba(198,161,90,0.55); }
  .side-sims strong { display: block; font-size: 0.95rem; }
  .side-sims em { display: block; font-style: normal; color: #b7ad9f; font-size: 0.78rem; }
  .chap-badge {
    display: grid; place-items: center; width: 2.6rem; height: 2.6rem; border-radius: 12px;
    background: var(--badge, var(--teal)); color: white; font-size: 0.72rem; font-weight: 700; line-height: 1.1; text-align: center;
  }
  .sim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.75rem; }
  .sim-card {
    text-align: left; width: 100%; background: white; border: 1px solid var(--line);
    border-top: 4px solid var(--badge, var(--teal)); border-radius: 18px; padding: 1rem;
    display: grid; gap: 0.45rem; transition: transform var(--rise), box-shadow var(--rise);
  }
  .sim-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(23,20,16,0.06); }
  .sim-card .head { display: flex; gap: 0.6rem; align-items: center; }
  .sim-card strong { font-size: 1.05rem; }
  .sim-card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .sim-card .go { color: var(--teal-deep); font-weight: 700; font-size: 0.9rem; }
  .sim-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; margin-bottom: 0.65rem; }
  .sim-head h2 { margin: 0; font-size: 1.15rem; }
  .sim-tools { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .sim-tools a.btn { text-decoration: none; display: inline-flex; align-items: center; }
  .sim-frame-wrap {
    position: relative; border-radius: 18px; overflow: hidden;
    border: 1px solid var(--line); background: #10182a;
    height: calc(100vh - 12rem); height: calc(100dvh - 12rem); min-height: 520px;
  }
  .sim-frame-wrap:fullscreen { border-radius: 0; height: 100vh; }
  .sim-frame-wrap iframe {
    position: relative; z-index: 1; display: block; width: 100%; height: 100%; border: 0;
    background: transparent; opacity: 0; transition: opacity 0.25s ease;
  }
  .sim-frame-wrap.ready iframe { opacity: 1; }
  .sim-loading {
    position: absolute; inset: 0; z-index: 0; display: grid; place-items: center;
    color: #d7e4f2; font-size: 0.95rem; pointer-events: none;
  }
  .sim-frame-wrap.ready .sim-loading { display: none; }
  .shell.sim-mode { height: 100vh; height: 100dvh; min-height: 0; }
  .shell.sim-mode .workspace { display: flex; flex-direction: column; overflow: hidden; padding: 0.75rem 1rem 0.9rem; }
  .shell.sim-mode .sim-head { margin-bottom: 0.5rem; }
  .shell.sim-mode .sim-head h2 { font-size: 1.05rem; }
  .shell.sim-mode .sim-tools .btn { min-height: 2.3rem; padding: 0.35rem 0.75rem; font-size: 0.88rem; }
  .shell.sim-mode .sim-frame-wrap { flex: 1 1 auto; height: auto; min-height: 0; }
  .shell.sim-mode.wide { grid-template-columns: minmax(0, 1fr); }
  .shell.sim-mode.wide .sidebar { display: none; }
  .side-foot {
    margin-top: auto; padding: 0.85rem 0.35rem 0.15rem;
    display: flex; justify-content: space-between; gap: 0.5rem; align-items: center;
    color: #b7ad9f; font-size: 0.8rem;
  }
  .linkish {
    background: transparent; border: 0; color: #e7d7b0; padding: 0.2rem; text-decoration: underline;
    text-underline-offset: 2px;
  }
  .workspace { min-width: 0; min-height: 0; overflow: auto; padding: 1.25rem 1.4rem 2.5rem; }
  .topbar { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-end; margin-bottom: 0.85rem; }
  .kicker { margin: 0; color: var(--teal); font-size: 0.82rem; letter-spacing: 0.04em; font-weight: 700; }
  h1.page { margin: 0.1rem 0 0; font-size: 1.6rem; line-height: 1.25; }
  .stepper { display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: flex-end; }
  .stepper button, .stepper span {
    display: flex; align-items: center; gap: 0.35rem;
    color: var(--muted); font-size: 0.86rem; padding: 0.2rem 0.35rem;
    background: transparent; border: 0; border-radius: 999px;
  }
  .stepper button:hover { background: rgba(13,107,98,0.08); }
  .stepper i {
    font-style: normal; width: 1.5rem; height: 1.5rem; border-radius: 50%;
    display: grid; place-items: center; border: 1px solid var(--line); background: white; font-size: 0.78rem;
  }
  .stepper .now { color: var(--ink); font-weight: 700; background: rgba(13,107,98,0.08); }
  .stepper .now i { background: var(--teal); color: white; border-color: var(--teal); }
  .stepper .did i { background: var(--good); color: white; border-color: var(--good); }
  .help { margin: 0 0 0.8rem; color: var(--muted); }
  .sheet, .card {
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 1.15rem 1.25rem 1.25rem;
    margin-bottom: 0.9rem;
    animation: rise-in 280ms ease;
  }
  .story { margin: 0.35rem 0 0.9rem; font-size: 1.06rem; }
  .msg {
    border-radius: 14px; padding: 0.8rem 0.95rem; margin-bottom: 0.85rem;
    animation: rise-in 220ms ease;
  }
  .msg.good { background: var(--good-bg); color: var(--good); }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .msg.info { background: var(--info-bg); color: var(--teal-deep); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 0.75rem; }
  .plate {
    text-align: left; width: 100%;
    border: 1px solid var(--line); background: white; border-radius: 18px;
    padding: 0.95rem 1rem 0.9rem; min-height: 118px;
    border-top: 4px solid var(--stripe, var(--teal));
    transition: border-color var(--rise), transform var(--rise), box-shadow var(--rise);
  }
  .plate:hover { transform: translateY(-3px); border-color: #d7c4a4; box-shadow: 0 10px 24px rgba(23,20,16,0.06); }
  .plate .label { display: block; font-weight: 700; }
  .plate small { display: block; color: var(--muted); margin-top: 0.25rem; }
  .plate.locked { opacity: 0.72; }

  .var-card.filled { box-shadow: 0 0 0 3px rgba(23,105,60,0.07); }

  .sim-frame-wrap { box-shadow: 0 30px 60px -30px rgba(18,30,54,0.8); }

  .var-note.bad { color: var(--bad); font-weight: 700; }
  .miss-box { margin: 0 0 0.8rem; padding: 0.8rem 0.95rem; border-radius: 14px; border: 1px dashed #d9b46a; background: linear-gradient(135deg, #fffaf0, #fdf3df); }

  .formula-mini { font-family: Cambria, Georgia, serif; font-size: 1.1rem; color: var(--teal-deep); margin-right: 0.25rem; }
  .miss-chip { display: inline-block; background: #fff; border: 1px solid #e4d4b0; border-radius: 999px; padding: 0.05rem 0.55rem; font-size: 0.85rem; }
  .sim-loading:before {
    content: ""; width: 42px; height: 42px; border-radius: 50%; margin-bottom: 4.5rem; position: absolute;
    border: 3px solid rgba(159,217,207,0.2); border-top-color: #9fd9cf; animation: spin 0.9s linear infinite;
  }
  @media (max-width: 900px) {

    .ask-box { grid-template-columns: auto 1fr; gap: 0.55rem; }

    .ask-box select, .add-box select, .add-box input, .side-prompt { min-height: 2.75rem; }
    .add-box .row { grid-template-columns: 1fr; }
    .var-row { grid-template-columns: 1fr; }

    .plate { min-height: 0; padding: 0.85rem 0.9rem; }
    .eqline {
      font-size: 1.35rem;

      padding-bottom: 0.35rem;
    }
    .board { padding: 1.05rem 0.7rem 0.85rem; border-radius: 16px; }

    .actions-main, .actions-sub, .row-actions { gap: 0.5rem; }
    .btn, .btn.calc, .btn.secondary, .btn.ghost {
      min-height: 2.75rem;
      padding: 0.7rem 0.9rem;
      width: auto;
      flex: 1 1 auto;
    }
    .actions-main .btn, .row-actions .btn.calc { flex: 1 1 100%; }
    .answer-num { font-size: 2.35rem; }
    .alt-topics { gap: 0.35rem; }

  }
  @media (max-width: 900px) {
    .side-sims { display: none; }

    .sim-tools { width: 100%; }
    .shell.sim-mode { height: auto; }
    .shell.sim-mode .workspace { display: block; overflow: visible; padding: 0.7rem 0.6rem calc(1rem + var(--safe-bottom)); }
    .shell.sim-mode .sim-frame-wrap { height: 80vh; height: 80dvh; min-height: 420px; }
    .shell.sim-mode.wide .sidebar { display: flex; }

  }
  @media (max-width: 420px) {

  @media (prefers-reduced-motion: reduce) {

  @media print {
    .sidebar, .actions, .row-actions, .stepper, .skip, .side-meter, .fx-bg, .fx-confetti { display: none !important; }
    .answer-num, h1.page, .welcome-hero h2 { color: #084841 !important; background: none !important; -webkit-text-fill-color: currentColor; }
    .shell { display: block; height: auto; }
    .workspace { overflow: visible; }
    .board { background: white; color: black; box-shadow: none; }
    .sheet, .card { box-shadow: none; }
  }

  /* ===== Physics Learning · navy space theme ===== */
  :root {
    --paper: #050c22; --sheet: rgba(13,27,64,0.62); --ink: #e8eeff; --muted: #9fb0d8; --line: rgba(140,170,255,0.18);
    --sidebar: #06102a; --cream: #e8eeff; --brass: #7dd3fc;
    --teal: #3b74ff; --teal-deep: #9cc0ff; --teal-soft: rgba(59,116,255,0.14);
    --good: #4ade80; --good-bg: rgba(74,222,128,0.12); --bad: #ff8f86; --bad-bg: rgba(255,107,97,0.13);
    --info-bg: rgba(59,116,255,0.14); --warn: #fcd34d; --warn-bg: rgba(252,211,77,0.12);
    --shadow: 0 18px 44px rgba(0,0,0,0.35); --nav-h: 4.7rem;
  }
  body {
    background:
      radial-gradient(1000px 600px at 75% -10%, rgba(47,107,255,0.22), transparent 60%),
      radial-gradient(800px 500px at 0% 30%, rgba(30,64,175,0.20), transparent 60%),
      radial-gradient(900px 600px at 50% 120%, rgba(56,189,248,0.10), transparent 60%),
      linear-gradient(180deg, #030817 0%, #061032 55%, #040a20 100%);
    background-attachment: fixed;
  }
  ::selection { background: rgba(59,116,255,0.4); color: #fff; }
  * { scrollbar-color: rgba(125,170,255,0.35) transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(125,170,255,0.3); background-clip: padding-box; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(125,170,255,0.3); background-clip: padding-box; }
  :focus-visible { outline-color: #7dd3fc; }
  .skip { background: #0b1f4d; color: #fff; }
  .fx-bg:before {
    background-image: linear-gradient(rgba(125,170,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(125,170,255,0.035) 1px, transparent 1px);
    background-size: 46px 46px;
  }
  .fx-bg:after {
    content: ""; position: absolute; inset: 0; opacity: 0.7;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 28% 62%, #cfe0ff, transparent),
      radial-gradient(1.5px 1.5px at 44% 30%, #fff, transparent), radial-gradient(1px 1px at 63% 78%, #fff, transparent),
      radial-gradient(1px 1px at 78% 22%, #cfe0ff, transparent), radial-gradient(1.5px 1.5px at 88% 54%, #fff, transparent),
      radial-gradient(1px 1px at 6% 86%, #cfe0ff, transparent), radial-gradient(1px 1px at 52% 92%, #fff, transparent);
    background-size: 420px 420px;
  }
  .blob.b1 { background: radial-gradient(circle, rgba(47,107,255,0.35), transparent 65%); }
  .blob.b2 { background: radial-gradient(circle, rgba(56,189,248,0.22), transparent 65%); }
  .blob.b3 { background: radial-gradient(circle, rgba(99,102,241,0.25), transparent 65%); }

  .shell { grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .shell.home, .shell.solo { grid-template-columns: minmax(0, 1fr); }
  .topnav {
    grid-column: 1 / -1; position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    min-height: var(--nav-h); padding: 0.6rem clamp(1rem, 4vw, 3.5rem);
    background: rgba(3,8,23,0.62); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border-bottom: 1px solid rgba(140,170,255,0.12);
  }
  .topnav .brand { padding: 0; gap: 0.65rem; background: transparent; border: 0; color: inherit; text-align: left; cursor: pointer; }
  .topnav .brand .name { display: block; }
  .topnav .brand:hover .mark { box-shadow: 0 0 26px rgba(91,140,255,0.75); }
  .mark {
    width: 48px; height: 48px; border-radius: 14px; color: #dbe7ff;
    border: 1px solid rgba(125,170,255,0.45);
    background: linear-gradient(135deg, rgba(59,116,255,0.45), rgba(30,58,138,0.55));
    box-shadow: 0 0 18px rgba(59,116,255,0.45);
  }
  .mark svg { width: 30px; height: 30px; }

  .brand .name {
    font-size: 1.3rem; font-weight: 700;

    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nav-tabs {
    display: flex; grid-template-columns: none; gap: 0.25rem; margin: 0; padding: 0.25rem;

  }

  .nav-tabs button:hover:not(.on) { background: rgba(255,255,255,0.07); color: #fff; }
  .nav-tabs button.on { background: linear-gradient(135deg, rgba(91,140,255,0.55), rgba(47,107,255,0.45)); color: #fff; box-shadow: 0 0 0 1px rgba(160,190,255,0.35) inset, 0 6px 20px -6px rgba(47,107,255,0.8); }

  .sidebar {
    position: sticky; top: var(--nav-h); align-self: start;
    height: calc(100vh - var(--nav-h)); height: calc(100dvh - var(--nav-h));
    background: linear-gradient(180deg, rgba(8,18,48,0.72), rgba(4,10,30,0.72));
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);

  .side-meter { background: rgba(255,255,255,0.04); border: 1px solid rgba(140,170,255,0.1); }

  .topic-live.wait { background: rgba(255,255,255,0.04); color: #9fb0d8; }
  .topic-live.hit { background: linear-gradient(135deg, rgba(59,116,255,0.2), rgba(56,189,248,0.1)); border-color: rgba(125,170,255,0.45); }
  .topic-live .meta { color: #b9c7e8; }

  .workspace { padding: 1.4rem clamp(1rem, 2.4vw, 2rem) 2.5rem; scroll-margin-top: var(--nav-h); }
  .kicker { color: #7dd3fc; }
  .kicker:before { background: linear-gradient(90deg, #3b74ff, #7dd3fc); }
  h1.page { background: linear-gradient(90deg, #ffffff, #bcd4ff 55%, #7dd3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stepper button:hover { background: rgba(59,116,255,0.12); }
  .stepper i { background: rgba(255,255,255,0.06); border-color: rgba(140,170,255,0.25); }
  .stepper .now { background: rgba(59,116,255,0.16); }
  .stepper .now i { box-shadow: 0 0 0 4px rgba(59,116,255,0.2); }
  .stepper .did i { color: #052e16; }
  @keyframes beat { 50% { box-shadow: 0 0 0 7px rgba(59,116,255,0.06); } }
  .sheet, .card {
    background: linear-gradient(180deg, rgba(16,32,76,0.66), rgba(9,20,52,0.62));
    border-color: rgba(140,170,255,0.16);
    box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 24px 50px -24px rgba(0,0,0,0.7);
  }

var CONST_TOKENS = { '2pi': 2 * Math.PI, '4pi': 4 * Math.PI, '4pi2': 4 * Math.PI * Math.PI };
function parseFactor(tok) {
  if (Object.prototype.hasOwnProperty.call(CONST_TOKENS, tok)) return num(CONST_TOKENS[tok]);
  if (/^[\d.]+(?:e-?\d+)?$/.test(tok)) return num(Number(tok));
  var bits = tok.split('^');
  return lit(bits[0], bits[1] ? Number(bits[1]) : 1);
}
function parseSide(src) {
  var parts = src.split(' / ');
  var body = parts[0].trim();
  var terms = [];
  var sign = 1;
  body.split(' ').forEach(function (tok) {
    if (tok === '+') { sign = 1; return; }
    if (tok === '-') { sign = -1; return; }
    if (tok.charAt(0) === '-') { sign = -1; tok = tok.slice(1); }
    terms.push(makeTerm(sign, tok.split('*').map(parseFactor)));
    sign = 1;
  });
  var denom = parts[1] ? parts[1].trim().split('*').map(parseFactor) : [];
  return makeSide(terms, denom);
}
function rule(topic, id, name, classic, src, when, extra) {
  var sides = src.split(' = ');
  var eq = equation(parseSide(sides[0]), parseSide(sides[1]));
  var vars = [];
  [eq.left, eq.right].forEach(function (side) {
    side.terms.forEach(function (t) { t.factors.forEach(function (f) { if (f.type === 'var' && vars.indexOf(f.name) === -1) vars.push(f.name); }); });
    side.denom.forEach(function (f) { if (f.type === 'var' && vars.indexOf(f.name) === -1) vars.push(f.name); });
  });
  var f = { id: id, topic: topic, name: name, classic: classic, when: when, vars: vars, eq: eq };
  if (extra) Object.keys(extra).forEach(function (k) { f[k] = extra[k]; });
  return f;
}

function dayKey(ms) { var d = new Date(ms); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function streakDays(log) {
  var days = {};
  log.forEach(function (e) { days[dayKey(e.at)] = true; });
  var d = new Date();
  if (!days[dayKey(d.getTime())]) d.setDate(d.getDate() - 1);
  var n = 0;
  while (days[dayKey(d.getTime())]) { n += 1; d.setDate(d.getDate() - 1); }
  return n;
}
function agoText(ms) {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var then = new Date(ms); then.setHours(0, 0, 0, 0);
  var diff = Math.round((today - then) / 86400000);
  if (diff <= 0) return 'วันนี้';
  if (diff === 1) return 'เมื่อวาน';
  if (diff < 30) return diff + ' วันก่อน';
  return then.getDate() + '/' + (then.getMonth() + 1) + '/' + (then.getFullYear() + 543);
}
